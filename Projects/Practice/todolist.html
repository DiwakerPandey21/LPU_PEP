<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Task List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 6px;
    }

    h2 {
      text-align: center;
    }

    #clock {
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
      color: #555;
    }

    input, textarea, button {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      font-size: 14px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .task {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
    }

    .countdown {
      font-size: 13px;
      color: #d9534f;
    }

    .notes {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Task List</h2>

  <div id="clock"></div>

  <input type="text" id="taskName" placeholder="Task Name">
  <input type="date" id="taskDate">
  <input type="time" id="taskTime">
  <textarea id="taskNotes" placeholder="Notes (optional)"></textarea>

  <button onclick="addTask()">Add Task</button>
  <div id="taskList"></div>
</div>

<script>
  const taskList = [];

  function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
      now.toLocaleDateString() + " " + now.toLocaleTimeString();
  }
  setInterval(updateClock, 1000);
  updateClock();

  function addTask() {
    const name = document.getElementById("taskName").value;
    const date = document.getElementById("taskDate").value;
    const time = document.getElementById("taskTime").value;
    const notes = document.getElementById("taskNotes").value;

    if (!name || !date || !time) {
      alert("Please fill task name, date and time");
      return;
    }

    const deadline = new Date(`${date}T${time}`);
    taskList.push({ name, deadline, notes });

    document.getElementById("taskName").value = "";
    document.getElementById("taskDate").value = "";
    document.getElementById("taskTime").value = "";
    document.getElementById("taskNotes").value = "";

    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    taskList.forEach((task, index) => {
      const div = document.createElement("div");
      div.className = "task";
      div.innerHTML = `
        <strong>${task.name}</strong>
        <div class="countdown" id="countdown-${index}"></div>
        ${task.notes ? `<div class="notes">${task.notes}</div>` : ""}
      `;
      list.appendChild(div);
    });
  }

  function updateCountdowns() {
    const now = new Date();

    taskList.forEach((task, index) => {
      const diff = task.deadline - now;
      const el = document.getElementById(`countdown-${index}`);
      if (!el) return;

      if (diff <= 0) {
        el.innerText = "⏰ Deadline passed";
      } else {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);

        el.innerText = `${days}d ${hours}h ${minutes}m remaining`;
      }
    });
  }

  setInterval(updateCountdowns, 1000);
</script>

</body>
</html>
